apiVersion: v1
kind: Service
metadata: 
  name: portfolio-service
  namespace: portfolio-app
  annotations:
    cloud.google.com/backend-config: '{"default": "portfolio-backendconfig"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: NodePort
  selector: 
    app: portfolio-backend
  ports: 
  - port: 8080
    targetPort: 8080
    protocol: TCP 
    name: http